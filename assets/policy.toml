# chief-of-stuff policy and workflow (design decisions 12 and 13), read by settings.load_policy.
#
# PLACEHOLDER CONTENT. The personas, their roles and models, the default trio and the topic tags below are stand-ins:
# their content is Open for Zach (design decisions 5 and 5a). The shape is what is settled.
#
# Every policy field starts from [policy] and is overridden, in order, by the persona's, the stage's and the room's own
# `policy` table, so a value set for one stage or room holds only there. A standing approval is a policy exception and
# must carry an expiry with its offset, for example:
#   [[rooms.<name>.policy.approvals]]
#   gate = "merge"
#   expires = 2026-10-12T00:00:00-07:00
# spend_usd, quota_percent and time_minutes are limits with no default: set in 1.1 from what 1.0 measures.

default_workflow = "standard"

[policy]
zach_gates = []              # decision 6: no gate needs Zach's own word by default
blocking_severity = "minor"  # burn down to no open findings
retry_limit = 3              # Zach, 2026-10-11: 3 fix rounds, then an unrecoverable-failure ping
launch = "adapter"           # Zach, 2026-10-11: the adapter by default, a full session where a persona or stage says so
trio = ["reviewer", "architect", "implementer"]  # PLACEHOLDER
trios = {}                   # PLACEHOLDER: decision topic tag -> three personas; the tags are Open

[personas.implementer]
role = "PLACEHOLDER: implements the issue"
model = "opus"

[personas.reviewer]
role = "PLACEHOLDER: reviews the change"
model = "opus"

[personas.architect]
role = "PLACEHOLDER: holds the change to the architecture"
model = "opus"
agent = "frank-lloyd-aight"

[stages.plan]
persona = "implementer"

[stages.implement]
persona = "implementer"

[stages.review]
persona = "reviewer"

[stages.review.policy]
architect = true  # decision 5: burn down to no open findings, consult the architect

[stages.fix]
persona = "implementer"

[stages.merge]

[workflows.standard]
start = "plan"
edges = [
  { from = "plan", to = "implement", gate = "plan" },
  { from = "implement", to = "review" },
  { from = "review", to = "fix" },
  { from = "fix", to = "review" },
  { from = "review", to = "merge", gate = "merge" },
]
