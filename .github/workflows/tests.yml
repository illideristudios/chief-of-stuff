name: tests

# Push only. A fork cannot push a branch here, so this workflow never runs a fork's code.
# A fork PR can still add its own workflow file. The only gate on that is the repo setting that
# every outside contributor's workflow run needs a maintainer's approval, so never approve a run
# on a fork PR that changes .github/.
on:
  push:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: ./.github/ci/run-evals
