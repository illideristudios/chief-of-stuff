<style>

<div style="width: 1280px; height: 1290px; box-sizing: border-box; display: grid; grid-template-columns: 1fr 1fr; font-size: 13px;">
  <sc-for list="{{sides}}" as="s" hint-placeholder-count="2">
    <div style="{{s.style}}">
      <div style="display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid {{s.brass}}; padding-bottom: 10px;">
        <h1 style="margin: 0; font-family: 'Cormorant SC', Georgia, serif; font-size: 27px; font-weight: 600; letter-spacing: .04em;">{{s.name}}</h1>
        <div style="{{s.sub}}">{{s.note}}</div>
      </div>
      <sc-for list="{{s.groups}}" as="g" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <h2 style="{{s.h2}}">{{g.title}}</h2>
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="8">
            <div style="display: grid; grid-template-columns: 44px 170px 1fr; align-items: center; gap: 12px; height: 22px;">
              <span style="{{r.swatch}}"></span>
              <span style="font-family: ui-monospace, monospace; font-size: 12px;">--{{r.name}}</span>
              <span style="{{r.hexStyle}}">{{r.value}}</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1290}}">
class Component extends DCLogic {
  renderVals() {
    var groups = [{"title": "GROUND AND TEXT", "rows": [["bg", "#f4efe1", "#1c1813"], ["surface", "#fbf8ef", "#262019"], ["fg", "#2f2630", "#efe6d2"], ["muted", "#6e6470", "#b3a791"], ["line", "#ddd3bd", "#3d352a"], ["brass", "#a7843e", "#d4b06a"], ["dl", "#c9533a", "#f08566"], ["band", "rgba(111,99,180,.14)", "rgba(160,150,230,.16)"]]}, {"title": "BARS", "rows": [["running", "#6f63b4", "#aba1e8"], ["open", "#9daa72", "#aab77d"], ["noest", "#2f8f86", "#62c2b6"], ["est", "#b5567a", "#e59bb8"], ["fold", "#8a7f9c", "#b7acc9"], ["done", "#bdb3a2", "#4a4236"], ["now", "#4f6b3a", "#a8c67e"], ["bar-ink", "#fbf8ef", "#1c1813"], ["seg-ink", "#2f2630", "#1c1813"]]}, {"title": "BODY LANE", "rows": [["sleep", "#332288", "#9c93e2"], ["eat", "#D55E00", "#f0955f"], ["gym", "#117733", "#72c28d"], ["recreation", "#F0E442", "#e6d95c"]]}, {"title": "STAGES", "rows": [["stage-implement", "#0072B2", "#3D95D6"], ["stage-pr", "#56B4E9", "#56B4E9"], ["stage-review", "#009E73", "#009E73"], ["stage-triage", "#E69F00", "#E69F00"], ["stage-fix", "#D55E00", "#D55E00"], ["stage-verify", "#CC79A7", "#CC79A7"], ["stage-merge", "#000000", "#efe6d2"]]}, {"title": "DECISION PAGE", "rows": [["link", "#8a6c30", "#e2c27f"], ["ref-bg", "#efe7d3", "#342b1f"], ["deployed", "#2b3542", "#d9d2c4"], ["inflight", "#a8660f", "#e8ad55"], ["inflight-soft", "#f6ead6", "#35281a"], ["designed", "#2c58a0", "#8fb3f0"], ["designed-soft", "#dfe8f6", "#1f2735"], ["ext", "#8a8f98", "#8f8a80"], ["ext-soft", "#f1eee6", "#2d2822"], ["ext-ink", "#5f6b7b", "#c4bdb0"]]}];
    var side = function (name, note, col, bg, fg, muted, line, brass) {
      return {
        name: name, note: note, brass: brass,
        style: 'background: ' + bg + '; color: ' + fg + '; padding: 24px 32px; display: flex; flex-direction: column; gap: 14px;',
        sub: 'font-size: 12.5px; color: ' + muted + ';',
        h2: "margin: 0; font-family: 'Cormorant SC', Georgia, serif; font-size: 15px; font-weight: 600; letter-spacing: .1em; color: " + brass + ';',
        groups: groups.map(function (g) {
          return { title: g.title, rows: g.rows.map(function (r) {
            return { name: r[0], value: r[col],
              swatch: 'display: block; height: 18px; border-radius: 3px; background: ' + r[col] + '; box-shadow: inset 0 0 0 1px ' + line + ';',

    ] };
  }
